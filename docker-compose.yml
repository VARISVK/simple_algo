version: '3.8'

services:
  trading-bot:
    build: .
    container_name: linda-raschke-bot
    restart: unless-stopped
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
      - ./trades.db:/app/trades.db
      - ./config:/app/config
    networks:
      - trading-network

networks:
  trading-network:
    driver: bridge

